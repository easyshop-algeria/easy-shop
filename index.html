<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Shop Algeria | إيزي شوب الجزائر</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f7fa;
  color:#172033;
}

button{
  font-family:inherit;
  cursor:pointer;
  border:0;
}

.topbar{
  background:#087f5b;
  color:white;
  text-align:center;
  padding:9px;
  font-size:14px;
}

header{
  background:white;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  color:#087f5b;
  font-size:25px;
  font-weight:bold;
  white-space:nowrap;
}

.search{
  flex:1;
  display:flex;
  background:#f1f4f6;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #e0e5e8;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  padding:13px;
  font-size:15px;
}

.search button{
  background:#087f5b;
  color:white;
  padding:0 18px;
}

.cart-btn{
  position:relative;
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px 16px;
  font-size:18px;
}

.cart-count{
  position:absolute;
  top:-7px;
  left:-7px;
  background:#e03131;
  color:white;
  width:22px;
  height:22px;
  border-radius:50%;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(135deg,#08b779,#05a66d);
  color:white;
  border-radius:20px;
  padding:40px;
  min-height:230px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
}

.hero h1{
  font-size:36px;
  margin-bottom:12px;
}

.hero p{
  font-size:18px;
  opacity:.95;
}

.hero button{
  background:white;
  color:#087f5b;
  padding:13px 25px;
  border-radius:10px;
  font-weight:bold;
  margin-top:20px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 0 15px;
}

.section-title h2{
  font-size:24px;
}

.categories{
  display:flex;
  gap:12px;
  overflow:auto;
  padding-bottom:8px;
}

.category{
  flex:0 0 auto;
  background:white;
  border:1px solid #e2e7ea;
  border-radius:12px;
  padding:12px 20px;
  font-weight:bold;
}

.category:hover,
.category.active{
  background:#087f5b;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:white;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #e5e9ec;
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.product-img{
  height:190px;
  background:#e9eef2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

.product-info{
  padding:15px;
}

.product-name{
  font-size:17px;
  font-weight:bold;
  min-height:42px;
}

.price{
  color:#087f5b;
  font-size:20px;
  font-weight:bold;
  margin:10px 0;
}

.stock{
  color:#087f5b;
  font-size:13px;
  margin-bottom:10px;
}

.add-btn{
  width:100%;
  background:#087f5b;
  color:white;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
}

.add-btn:hover{
  background:#066b4d;
}

.empty{
  text-align:center;
  padding:35px;
  color:#777;
  background:white;
  border-radius:15px;
}

footer{
  margin-top:45px;
  background:#101c32;
  color:white;
  padding:25px;
  text-align:center;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:50;
}

.drawer{
  position:fixed;
  top:0;
  left:-430px;
  width:400px;
  max-width:92%;
  height:100%;
  background:white;
  z-index:60;
  transition:.25s;
  padding:22px;
  overflow:auto;
}

.drawer.open{
  left:0;
}

.overlay.open{
  display:block;
}

.drawer-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  background:#eee;
  border-radius:8px;
  padding:8px 12px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
}

.qty button{
  width:27px;
  height:27px;
  border-radius:6px;
  background:#e9eeee;
}

.total{
  font-size:21px;
  font-weight:bold;
  margin:20px 0;
}

.checkout{
  width:100%;
  background:#087f5b;
  color:white;
  padding:14px;
  border-radius:10px;
  font-weight:bold;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.open{
  display:flex;
}

.modal-box{
  background:white;
  width:500px;
  max-width:100%;
  border-radius:18px;
  padding:25px;
}

.modal-box h2{
  margin-bottom:18px;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #d9dfe3;
  border-radius:9px;
  padding:12px;
  outline:0;
  font-family:inherit;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.cancel{
  flex:1;
  background:#eee;
  padding:12px;
  border-radius:9px;
}

.confirm{
  flex:2;
  background:#087f5b;
  color:white;
  padding:12px;
  border-radius:9px;
}

.toast{
  position:fixed;
  bottom:25px;
  right:25px;
  background:#172033;
  color:white;
  padding:14px 20px;
  border-radius:10px;
  z-index:200;
  display:none;
}

.toast.show{
  display:block;
}

@media(max-width:900px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){
  .header-inner{
    flex-wrap:wrap;
  }

  .logo{
    flex:1;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .hero{
    padding:25px;
  }

  .hero h1{
    font-size:27px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product-img{
    height:150px;
  }

  .drawer{
    width:360px;
  }
}

@media(max-width:420px){
  .products{
    grid-template-columns:1fr 1fr;
  }

  .product-name{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="topbar">
🚚 توصيل سريع إلى 58 ولاية الجزائر • الدفع عند الاستلام
</div>

<header>
  <div class="header-inner">

    <div class="logo">
      🛍️ Easy Shop Algeria
    </div>

    <div class="search">
      <input id="searchInput" type="text" placeholder="ابحث عن منتج...">
      <button onclick="searchProducts()">🔍</button>
    </div>

    <button class="cart-btn" onclick="openCart()">
      🛒
      <span class="cart-count" id="cartCount">0</span>
    </button>

  </div>
</header>

<main class="container">

<section class="hero">
  <div>
    <h1>إيزي شوب الجزائر 🇩🇿</h1>
    <p>منتجات مختارة • أسعار مناسبة • توصيل إلى 58 ولاية</p>
    <button onclick="scrollToProducts()">اكتشف المنتجات الآن</button>
  </div>
</section>

<div class="section-title">
  <h2>الفئات</h2>
</div>

<div class="categories">
  <button class="category active" onclick="filterCategory('all',this)">الكل</button>
  <button class="category" onclick="filterCategory('home',this)">🏠 أدوات منزلية</button>
  <button class="category" onclick="filterCategory('electronics',this)">⚡ إلكترونيات</button>
  <button class="category" onclick="filterCategory('sports',this)">🏆 رياضة</button>
  <button class="category" onclick="filterCategory('men',this)">👕 رجالية</button>
</div>

<div class="section-title" id="productsSection">
  <h2>منتجاتنا</h2>
</div>

<div class="products" id="products"></div>

</main>

<footer>
  <p>Easy Shop Algeria 🇩🇿</p>
  <p style="margin-top:8px;font-size:13px">
    الدفع عند الاستلام • توصيل 58 ولاية • ضمان الاستبدال
  </p>
</footer>

<div class="overlay" id="overlay" onclick="closeCart()"></div>

<aside class="drawer" id="cartDrawer">

  <div class="drawer-head">
    <h2>🛒 سلة المشتريات</h2>
    <button class="close" onclick="closeCart()">✕</button>
  </div>

  <div id="cartItems"></div>

  <div class="total">
    الإجمالي: <span id="cartTotal">0</span> دج
  </div>

  <button class="checkout" onclick="openCheckout()">
    إتمام الطلب
  </button>

</aside>

<div class="modal" id="checkoutModal">

  <div class="modal-box">

    <h2>📦 معلومات الطلب</h2>

    <div class="form-group">
      <label>الاسم واللقب</label>
      <input id="customerName" type="text" placeholder="اكتب اسمك الكامل">
    </div>

    <div class="form-group">
      <label>رقم الهاتف</label>
      <input id="customerPhone" type="tel" placeholder="05 / 06 / 07">
    </div>

    <div class="form-group">
      <label>الولاية</label>
      <select id="wilaya">
        <option value="">اختر الولاية</option>
        <option>01 - أدرار</option>
        <option>02 - الشلف</option>
        <option>03 - الأغواط</option>
        <option>04 - أم البواقي</option>
        <option>05 - باتنة</option>
        <option>06 - بجاية</option>
        <option>07 - بسكرة</option>
        <option>08 - بشار</option>
        <option>09 - البليدة</option>
        <option>10 - البويرة</option>
        <option>11 - تمنراست</option>
        <option>12 - تبسة</option>
        <option>13 - تلمسان</option>
        <option>14 - تيارت</option>
        <option>15 - تيزي وزو</option>
        <option>16 - الجزائر</option>
        <option>17 - الجلفة</option>
        <option>18 - جيجل</option>
        <option>19 - سطيف</option>
        <option>20 - سعيدة</option>
        <option>21 - سكيكدة</option>
        <option>22 - سيدي بلعباس</option>
        <option>23 - عنابة</option>
        <option>24 - قالمة</option>
        <option>25 - قسنطينة</option>
        <option>26 - المدية</option>
        <option>27 - مستغانم</option>
        <option>28 - المسيلة</option>
        <option>29 - معسكر</option>
        <option>30 - ورقلة</option>
        <option>31 - وهران</option>
        <option>32 - البيض</option>
        <option>33 - إليزي</option>
        <option>34 - برج بوعريريج</option>
        <option>35 - بومرداس</option>
        <option>36 - الطارف</option>
        <option>37 - تندوف</option>
        <option>38 - تيسمسيلت</option>
        <option>39 - الوادي</option>
        <option>40 - خنشلة</option>
        <option>41 - سوق أهراس</option>
        <option>42 - تيبازة</option>
        <option>43 - ميلة</option>
        <option>44 - عين الدفلى</option>
        <option>45 - النعامة</option>
        <option>46 - عين تموشنت</option>
        <option>47 - غرداية</option>
        <option>48 - غليزان</option>
        <option>49 - تيميمون</option>
        <option>50 - برج باجي مختار</option>
        <option>51 - أولاد جلال</option>
        <option>52 - بني عباس</option>
        <option>53 - عين صالح</option>
        <option>54 - عين قزام</option>
        <option>55 - تقرت</option>
        <option>56 - جانت</option>
        <option>57 - المغير</option>
        <option>58 - المنيعة</option>
      </select>
    </div>

    <div class="form-group">
      <label>العنوان</label>
      <textarea id="customerAddress" rows="3" placeholder="البلدية والعنوان بالتفصيل"></textarea>
    </div>

    <div class="form-actions">
      <button class="cancel" onclick="closeCheckout()">إلغاء</button>
      <button class="confirm" onclick="confirmOrder()">تأكيد الطلب</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>

const products = [
  {
    id:1,
    name:"حامل جوال متعدد الاستخدام",
    price:1800,
    category:"electronics",
    icon:"📱"
  },
  {
    id:2,
    name:"كرة القدم المصغرة للأطفال",
    price:3200,
    category:"sports",
    icon:"⚽"
  },
  {
    id:3,
    name:"مظلة شمسية للسيارات",
    price:2500,
    category:"home",
    icon:"🚗"
  },
  {
    id:4,
    name:"منظم منزلي عملي",
    price:2200,
    category:"home",
    icon:"🏠"
  },
  {
    id:5,
    name:"حقيبة رياضية",
    price:3500,
    category:"sports",
    icon:"🎒"
  },
  {
    id:6,
    name:"تيشيرت رجالي",
    price:2800,
    category:"men",
    icon:"👕"
  }
];

let cart = [];

function formatPrice(price){
  return price.toLocaleString("fr-DZ");
}

function renderProducts(list = products){

  const box = document.getElementById("products");

  if(list.length === 0){
    box.innerHTML = '<div class="empty">لم يتم العثور على منتجات.</div>';
    return;
  }

  box.innerHTML = list.map(product => `
    <article class="product">
      <div class="product-img">${product.icon}</div>

      <div class="product-info">

        <div class="product-name">
          ${product.name}
        </div>

        <div class="price">
          ${formatPrice(product.price)} دج
        </div>

        <div class="stock">
          ✓ متوفر
        </div>

        <button class="add-btn"
          onclick="addToCart(${product.id})">
          أضف إلى السلة
        </button>

      </div>
    </article>
  `).join("");
}

function addToCart(id){

  const product = products.find(p => p.id === id);

  if(!product) return;

  const existing = cart.find(item => item.id === id);

  if(existing){
    existing.quantity++;
  }else{
    cart.push({
      ...product,
      quantity:1
    });
  }

  updateCart();

  showToast("تمت إضافة المنتج إلى السلة ✓");
}

function updateCart(){

  const count = cart.reduce(
    (sum,item) => sum + item.quantity,
    0
  );

  document.getElementById("cartCount").textContent = count;

  const box = document.getElementById("cartItems");

  if(cart.length === 0){
    box.innerHTML =
      '<div class="empty">السلة فارغة</div>';

    document.getElementById("cartTotal").textContent = "0";

    return;
  }

  box.innerHTML = cart.map(item => `
    <div class="cart-item">

      <div>
        <strong>${item.name}</strong>
        <div style="margin-top:5px">
          ${formatPrice(item.price)} دج
        </div>
      </div>

      <div class="qty">

        <button onclick="changeQuantity(${item.id},1)">
          +
        </button>

        <span>${item.quantity}</span>

        <button onclick="changeQuantity(${item.id},-1)">
          −
        </button>

      </div>

    </div>
  `).join("");

  const total = cart.reduce(
    (sum,item) => sum + item.price * item.quantity,
    0
  );

  document.getElementById("cartTotal").textContent =
    formatPrice(total);
}

function changeQuantity(id,change){

  const item = cart.find(p => p.id === id);

  if(!item) return;

  item.quantity += change;

  if(item.quantity <= 0){
    cart = cart.filter(p => p.id !== id);
  }

  updateCart();
}

function openCart(){

  document.getElementById("cartDrawer")
    .classList.add("open");

  document.getElementById("overlay")
    .classList.add("open");
}

function closeCart(){

  document.getElementById("cartDrawer")
    .classList.remove("open");

  document.getElementById("overlay")
    .classList.remove("open");
}

function openCheckout(){

  if(cart.length === 0){
    showToast("السلة فارغة");
    return;
  }

  document.getElementById("checkoutModal")
    .classList.add("open");
}

function closeCheckout(){

  document.getElementById("checkoutModal")
    .classList.remove("open");
}

function confirmOrder(){

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const wilaya =
    document.getElementById("wilaya").value;

  const address =
    document.getElementById("customerAddress").value.trim();

  if(!name || !phone || !wilaya || !address){

    showToast("يرجى ملء جميع معلومات الطلب");

    return;
  }

  /*
    في هذه المرحلة لا نرسل الطلب إلى Supabase.
    سنربطه بقاعدة البيانات بعد اختبار الواجهة.
  */

  closeCheckout();
  closeCart();

  cart = [];
  updateCart();

  document.getElementById("customerName").value = "";
  document.getElementById("customerPhone").value = "";
  document.getElementById("wilaya").value = "";
  document.getElementById("customerAddress").value = "";

  showToast("تم تسجيل الطلب تجريبيًا ✓");
}

function filterCategory(category,button){

  document.querySelectorAll(".category")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  if(category === "all"){
    renderProducts(products);
    return;
  }

  renderProducts(
    products.filter(
      product => product.category === category
    )
  );
}

function searchProducts(){

  const query =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if(!query){
    renderProducts(products);
    return;
  }

  const results = products.filter(product =>
    product.name.toLowerCase().includes(query)
  );

  renderProducts(results);
}

document.getElementById("searchInput")
  .addEventListener("input", searchProducts);

function scrollToProducts(){

  document.getElementById("productsSection")
    .scrollIntoView({
      behavior:"smooth"
    });
}

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  },2500);
}

renderProducts();
updateCart();

</script>

</body>
</html>
