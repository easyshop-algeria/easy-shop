<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Easy Shop Algeria | إيزي شوب الجزائر</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f7fa;
  color:#172033;
}

button{
  font-family:inherit;
  cursor:pointer;
  border:0;
}

input,
textarea,
select{
  font-family:inherit;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  background:#087f5b;
  color:white;
  text-align:center;
  padding:9px;
  font-size:14px;
}

/* =========================
   HEADER
========================= */

header{
  background:white;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  color:#087f5b;
  font-size:25px;
  font-weight:bold;
  white-space:nowrap;
}

.search{
  flex:1;
  display:flex;
  background:#f1f4f6;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #e0e5e8;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  padding:13px;
  font-size:15px;
}

.search button{
  background:#087f5b;
  color:white;
  padding:0 18px;
}

.cart-btn{
  position:relative;
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px 16px;
  font-size:18px;
}

.cart-count{
  position:absolute;
  top:-7px;
  left:-7px;
  background:#e03131;
  color:white;
  width:22px;
  height:22px;
  border-radius:50%;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   CONTAINER
========================= */

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* =========================
   HERO
========================= */

.hero{
  background:linear-gradient(135deg,#08b779,#05a66d);
  color:white;
  border-radius:20px;
  padding:40px;
  min-height:230px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
}

.hero h1{
  font-size:36px;
  margin-bottom:12px;
}

.hero p{
  font-size:18px;
  opacity:.95;
}

.hero button{
  background:white;
  color:#087f5b;
  padding:13px 25px;
  border-radius:10px;
  font-weight:bold;
  margin-top:20px;
}

/* =========================
   SECTION
========================= */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 0 15px;
}

.section-title h2{
  font-size:24px;
}

/* =========================
   CATEGORIES
========================= */

.categories{
  display:flex;
  gap:12px;
  overflow:auto;
  padding-bottom:8px;
}

.category{
  flex:0 0 auto;
  background:white;
  border:1px solid #e2e7ea;
  border-radius:12px;
  padding:12px 20px;
  font-weight:bold;
}

.category:hover,
.category.active{
  background:#087f5b;
  color:white;
}

/* =========================
   PRODUCTS
========================= */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:white;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #e5e9ec;
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.product-img{
  height:190px;
  background:#e9eef2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

.product-info{
  padding:15px;
}

.product-name{
  font-size:17px;
  font-weight:bold;
  min-height:42px;
}

.price{
  color:#087f5b;
  font-size:20px;
  font-weight:bold;
  margin:10px 0;
}

.stock{
  color:#087f5b;
  font-size:13px;
  margin-bottom:10px;
}

.add-btn{
  width:100%;
  background:#087f5b;
  color:white;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
}

.add-btn:hover{
  background:#066b4d;
}

.empty{
  text-align:center;
  padding:35px;
  color:#777;
  background:white;
  border-radius:15px;
}

/* =========================
   FOOTER
========================= */

footer{
  margin-top:45px;
  background:#101c32;
  color:white;
  padding:25px;
  text-align:center;
}

/* =========================
   CART
========================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:50;
}

.overlay.open{
  display:block;
}

.drawer{
  position:fixed;
  top:0;
  right:-430px;
  width:400px;
  max-width:92%;
  height:100%;
  background:white;
  z-index:60;
  transition:.25s;
  padding:22px;
  overflow:auto;
  box-shadow:-5px 0 20px rgba(0,0,0,.15);
}

.drawer.open{
  right:0;
}

.drawer-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  background:#eee;
  border-radius:8px;
  padding:8px 12px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.cart-item-info{
  flex:1;
}

.cart-item-name{
  font-weight:bold;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
}

.qty button{
  width:27px;
  height:27px;
  border-radius:6px;
  background:#e9eeee;
}

.qty button:hover{
  background:#dce5e2;
}

.total{
  font-size:21px;
  font-weight:bold;
  margin:20px 0;
}

.checkout{
  width:100%;
  background:#087f5b;
  color:white;
  padding:14px;
  border-radius:10px;
  font-weight:bold;
}

.checkout:hover{
  background:#066b4d;
}

/* =========================
   MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.open{
  display:flex;
}

.modal-box{
  background:white;
  width:520px;
  max-width:100%;
  max-height:92vh;
  overflow:auto;
  border-radius:18px;
  padding:25px;
}

.modal-box h2{
  margin-bottom:18px;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #d9dfe3;
  border-radius:9px;
  padding:12px;
  outline:0;
  font-family:inherit;
  background:white;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
  border-color:#087f5b;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.cancel{
  flex:1;
  background:#eee;
  padding:12px;
  border-radius:9px;
}

.confirm{
  flex:2;
  background:#087f5b;
  color:white;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
}

.confirm:hover{
  background:#066b4d;
}

.confirm:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* =========================
   ORDER SUMMARY
========================= */

.order-summary{
  background:#f5f7fa;
  border-radius:10px;
  padding:14px;
  margin-top:15px;
  font-size:14px;
}

.order-summary-title{
  font-weight:bold;
  margin-bottom:8px;
}

.order-summary-item{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
  border-bottom:1px solid #e5e5e5;
}

.order-summary-item:last-child{
  border-bottom:0;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  bottom:25px;
  right:25px;
  background:#172033;
  color:white;
  padding:14px 20px;
  border-radius:10px;
  z-index:200;
  display:none;
  max-width:90%;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.toast.show{
  display:block;
}

.toast.success{
  background:#087f5b;
}

.toast.error{
  background:#c92a2a;
}

/* =========================
   LOADING
========================= */

.loading{
  text-align:center;
  padding:20px;
  color:#777;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

  .products{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:650px){

  .header-inner{
    flex-wrap:wrap;
  }

  .logo{
    flex:1;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .hero{
    padding:25px;
  }

  .hero h1{
    font-size:27px;
  }

  .hero p{
    font-size:16px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product-img{
    height:150px;
  }

  .drawer{
    width:360px;
  }

}

@media(max-width:420px){

  .products{
    grid-template-columns:1fr 1fr;
  }

  .product-name{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }

  .hero{
    padding:20px;
  }

  .hero h1{
    font-size:24px;
  }

}

</style>
</head>

<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
  "https://obbdfpbejxmbyabriuwu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_tkJrAS8Jupol-KcbNov0DA_LDhbtwit";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   PRODUCTS
===================================================== */

const products = [

  {
    id:1,
    name:"حامل جوال متعدد الاستخدام",
    price:1800,
    category:"electronics",
    icon:"📱"
  },

  {
    id:2,
    name:"كرة القدم المصغرة للأطفال",
    price:3200,
    category:"sports",
    icon:"⚽"
  },

  {
    id:3,
    name:"مظلة شمسية للسيارات",
    price:2500,
    category:"home",
    icon:"🚗"
  },

  {
    id:4,
    name:"منظم منزلي عملي",
    price:2200,
    category:"home",
    icon:"🏠"
  },

  {
    id:5,
    name:"حقيبة رياضية",
    price:3500,
    category:"sports",
    icon:"🎒"
  },

  {
    id:6,
    name:"تيشيرت رجالي",
    price:2800,
    category:"men",
    icon:"👕"
  }

];


/* =====================================================
   CART
===================================================== */

let cart = [];


/* =====================================================
   PRICE FORMAT
===================================================== */

function formatPrice(price){

  return Number(price).toLocaleString("fr-DZ");

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(list = products){

  const box =
    document.getElementById("products");

  if(!box){
    return;
  }

  if(list.length === 0){

    box.innerHTML =
      '<div class="empty">لم يتم العثور على منتجات.</div>';

    return;
  }

  box.innerHTML = list.map(product => `

    <article class="product">

      <div class="product-img">
        ${product.icon}
      </div>

      <div class="product-info">

        <div class="product-name">
          ${product.name}
        </div>

        <div class="price">
          ${formatPrice(product.price)} دج
        </div>

        <div class="stock">
          ✓ متوفر
        </div>

        <button
          class="add-btn"
          onclick="addToCart(${product.id})"
        >
          أضف إلى السلة
        </button>

      </div>

    </article>

  `).join("");

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(id){

  const product =
    products.find(
      p => p.id === id
    );

  if(!product){
    return;
  }

  const existing =
    cart.find(
      item => item.id === id
    );

  if(existing){

    existing.quantity++;

  }else{

    cart.push({
      ...product,
      quantity:1
    });

  }

  updateCart();

  showToast(
    "تمت إضافة المنتج إلى السلة ✓",
    "success"
  );

}


/* =====================================================
   UPDATE CART
===================================================== */

function updateCart(){

  const count =
    cart.reduce(
      (sum,item) =>
        sum + item.quantity,
      0
    );

  const countElement =
    document.getElementById("cartCount");

  if(countElement){

    countElement.textContent =
      count;

  }

  const box =
    document.getElementById("cartItems");

  if(!box){
    return;
  }

  if(cart.length === 0){

    box.innerHTML =
      '<div class="empty">السلة فارغة</div>';

    document.getElementById(
      "cartTotal"
    ).textContent = "0";

    return;
  }

  box.innerHTML =
    cart.map(item => `

      <div class="cart-item">

        <div class="cart-item-info">

          <div class="cart-item-name">
            ${item.name}
          </div>

          <div style="margin-top:5px">
            ${formatPrice(item.price)} دج
          </div>

        </div>

        <div class="qty">

          <button
            onclick="changeQuantity(${item.id},1)"
          >
            +
          </button>

          <span>
            ${item.quantity}
          </span>

          <button
            onclick="changeQuantity(${item.id},-1)"
          >
            −
          </button>

        </div>

      </div>

    `).join("");

  const total =
    cart.reduce(
      (sum,item) =>
        sum +
        item.price *
        item.quantity,
      0
    );

  document.getElementById(
    "cartTotal"
  ).textContent =
    formatPrice(total);

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeQuantity(id,change){

  const item =
    cart.find(
      p => p.id === id
    );

  if(!item){
    return;
  }

  item.quantity += change;

  if(item.quantity <= 0){

    cart =
      cart.filter(
        p => p.id !== id
      );

  }

  updateCart();

}


/* =====================================================
   OPEN CART
===================================================== */

function openCart(){

    .getElementById("cartDrawer")

===================================================== */

function closeCart(){

    >

/* =====================================================
   GET WILAYA CODE
===================================================== */

function getWilayaCode(wilaya){

  if(!wilaya){
    return "";
  }

  return wilaya
    .split("-")[0]
    .trim();

}


/* =====================================================
   GET WILAYA NAME
===================================================== */

function getWilayaName(wilaya){

  if(!wilaya){
    return "";
  }

  const parts =
    wilaya.split("-");

  if(parts.length < 2){
    return wilaya.trim();
  }

  return parts
    .slice(1)
    .join("-")
    .trim();

}


/* =====================================================
   VALIDATE PHONE
===================================================== */

function validatePhone(phone){

  const clean =
    phone.replace(
      /[\s\-]/g,
      ""
    );

  return /^(0)(5|6|7)[0-9]{8}$/.test(
    clean
  );

}


/* =====================================================
   CONFIRM ORDER
===================================================== */

async function confirmOrder(){

  /* -----------------------------------------------
     GET FORM DATA
  ------------------------------------------------ */

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();

  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();

  const wilaya =
    document
      .getElementById("wilaya")
      .value;

  const municipality =
    document
      .getElementById("municipality")
      .value
      .trim();

  const address =
    document
      .getElementById("customerAddress")
      .value
      .trim();

  const deliveryType =
    document
      .getElementById("deliveryType")
      .value;


  /* -----------------------------------------------
     BASIC VALIDATION
  ------------------------------------------------ */

  if(!name){

    showToast(
      "يرجى كتابة الاسم واللقب",
      "error"
    );

    return;
  }

  if(!phone){

    showToast(
      "يرجى كتابة رقم الهاتف",
      "error"
    );

    return;
  }

  if(!validatePhone(phone)){

    showToast(
      "رقم الهاتف غير صحيح",
      "error"
    );

    return;
  }

  if(!wilaya){

    showToast(
      "يرجى اختيار الولاية",
      "error"
    );

    return;
  }

  if(!municipality){

    showToast(
      "يرجى كتابة البلدية",
      "error"
    );

    return;
  }

  if(!address){

    showToast(
      "يرجى كتابة العنوان",
      "error"
    );

    return;
  }

  if(cart.length === 0){

    showToast(
      "السلة فارغة",
      "error"
    );

    return;
  }


  /* -----------------------------------------------
     DISABLE BUTTON
  ------------------------------------------------ */

  const confirmButton =
    document.getElementById(
      "confirmButton"
    );

  confirmButton.disabled = true;

  confirmButton.textContent =
    "جاري إرسال الطلب...";


  try{

    /* -------------------------------------------
       CALCULATE TOTAL
    -------------------------------------------- */

    const subtotal =
      cart.reduce(
        (sum,item) =>
          sum +
          item.price *
          item.quantity,
        0
      );

    /*
      حاليًا تكلفة التوصيل = 0.
      يمكننا لاحقًا إضافة أسعار التوصيل
      حسب الولاية.
    */

    const shippingCost = 0;

    const total =
      subtotal +
      shippingCost;


    /* -------------------------------------------
       CREATE PRODUCTS DESCRIPTION
    -------------------------------------------- */

    const orderProducts =
      cart.map(item => ({
        id:item.id,
        name:item.name,
        price:item.price,
        quantity:item.quantity
      }));


    /* -------------------------------------------
       NOTES
    -------------------------------------------- */

    const notes =
      JSON.stringify(
        orderProducts,
        null,
        2
      );


    /* -------------------------------------------
       WILAYA
    -------------------------------------------- */

    const wilayaCode =
      getWilayaCode(wilaya);

    const wilayaName =
      getWilayaName(wilaya);


    /* -------------------------------------------
       INSERT INTO SUPABASE
    -------------------------------------------- */

    const { data, error } =
      await supabaseClient
        .from("orders")
        .insert({

          customer_name:name,

          phone:phone,

          wilaya_code:wilayaCode,

          wilaya_name:wilayaName,

          municipality:municipality,

          address:address,

          notes:notes,

          delivery_type:deliveryType,

          subtotal:subtotal,

          shipping_cost:shippingCost,

          total:total,

          status:"pending"

        })
        .select()
        .single();


    /* -------------------------------------------
       ERROR
    -------------------------------------------- */

    if(error){

      console.error(
        "Supabase error:",
        error
      );

      throw error;

    }


    /* -------------------------------------------
       SUCCESS
    -------------------------------------------- */

    console.log(
      "Order created:",
      data
    );


    closeCheckout();

    closeCart();


    cart = [];

    updateCart();


    /* -------------------------------------------
       CLEAR FORM
    -------------------------------------------- */

    document
      .getElementById("customerName")
      .value = "";

    document
      .getElementById("customerPhone")
      .value = "";

    document
      .getElementById("wilaya")
      .value = "";

    document
      .getElementById("municipality")
      .value = "";

    document
      .getElementById("customerAddress")
      .value = "";

    document
      .getElementById("deliveryType")
      .value = "home";


    /* -------------------------------------------
       SUCCESS MESSAGE
    -------------------------------------------- */

    showToast(
      "تم تسجيل طلبك بنجاح ✓",
      "success"
    );


  }catch(error){

    console.error(
      "ORDER ERROR:",
      error
    );


    let message =
      "حدث خطأ أثناء تسجيل الطلب";


    if(error && error.message){

      message =
        "خطأ: " +
        error.message;

    }


    showToast(
      message,
      "error"
    );


  }finally{

    confirmButton.disabled = false;

    confirmButton.textContent =
      "تأكيد الطلب";

  }

}


/* =====================================================
   FILTER CATEGORY
===================================================== */

function filterCategory(
  category,
  button
){

  document
    .querySelectorAll(".category")
    .forEach(btn =>
      btn.classList.remove(
        "active"
      )
    );

  button.classList.add("active");


  if(category === "all"){

    renderProducts(products);

    return;
  }


  renderProducts(

    products.filter(
      product =>
        product.category ===
        category
    )

  );

}


/* =====================================================
   SEARCH
===================================================== */

function searchProducts(){

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  if(!query){

    renderProducts(products);

    return;
  }


  const results =
    products.filter(product =>

      product.name
        .toLowerCase()
        .includes(query)

    );


  renderProducts(results);

}


/* =====================================================
   SEARCH EVENT
===================================================== */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    searchProducts
  );


/* =====================================================
   SCROLL TO PRODUCTS
===================================================== */

function scrollToProducts(){

  document
    .getElementById(
      "productsSection"
    )
    .scrollIntoView({

      behavior:"smooth"

    });

}


/* =====================================================
   TOAST
===================================================== */

function showToast(
  message,
  type = ""
){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.className =
    "toast show " +
    type;


  setTimeout(() => {

    toast.className =
      "toast";

  },3500);

}


/* =====================================================
   INITIALIZE
===================================================== */

renderProducts();

updateCart();

</script>
